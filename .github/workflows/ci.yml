name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          go build -ldflags "-X github.com/sebihoermann/devdb-go/internal/cli.Version=${VERSION}" -o devdb ./cmd/devdb

      # Prove the release path end to end: a binary built with an injected
      # version must report it, so `--version` can never ship a stale "dev"
      # literal that only survives because nobody checked.
      - name: Verify --version reports the injected version
        run: |
          out="$(./devdb --version)"
          echo "$out"
          case "$out" in
            "devdb version dev") echo "version was not injected"; exit 1 ;;
            "devdb version "?*) echo "ok" ;;
            *) echo "unexpected --version output"; exit 1 ;;
          esac
