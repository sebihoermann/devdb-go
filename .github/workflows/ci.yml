name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run tests
        run: go test ./...

      # Every devdb verb the docs name must resolve against the real command
      # tree. The regression tests in internal/cli cover the resolution and
      # tokenisation logic; this runs the lint itself over the whole repo, so
      # a doc that names a dead verb fails CI rather than reaching a reader.
      - name: Lint every devdb verb the docs name
        run: python3 scripts/doc-verb-lint.py

      # The command reference is generated from the cobra tree, so it cannot
      # drift by construction — but only if a changed verb forces a
      # regeneration. --check regenerates in memory and diffs, so adding a
      # verb without re-running `go run ./cmd/gen-docs` fails here instead of
      # shipping a stale reference.
      - name: Command reference is up to date
        run: go run ./cmd/gen-docs --check

      - name: Build binary
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          go build -ldflags "-X github.com/sebihoermann/devdb-go/internal/cli.Version=${VERSION}" -o devdb ./cmd/devdb

      # Prove the release path end to end: a binary built with an injected
      # version must report it, so `--version` can never ship a stale "dev"
      # literal that only survives because nobody checked.
      - name: Verify --version reports the injected version
        run: |
          out="$(./devdb --version)"
          echo "$out"
          case "$out" in
            "devdb version dev") echo "version was not injected"; exit 1 ;;
            "devdb version "?*) echo "ok" ;;
            *) echo "unexpected --version output"; exit 1 ;;
          esac
